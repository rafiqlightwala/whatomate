name: Release Branch Docker Deploy

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: release-branch-caprover
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/whatomate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Compute image tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_SHA=${IMAGE_REPO}:release-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_LATEST=${IMAGE_REPO}:release-latest" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.captain
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_TAG_SHA }}
            ${{ env.IMAGE_TAG_LATEST }}

      # Calls CapRover's deploy API directly. The caprover/deploy-from-github action (CapRover CLI)
      # always prefixes the server with "captain.", which breaks dashboards on other hostnames.
      - name: Deploy image to CapRover
        env:
          CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER }}
          CAPROVER_APP_NAME: ${{ secrets.CAPROVER_APP_NAME }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
        run: |
          set -euo pipefail
          body=$(jq -n --arg image "$IMAGE_TAG_SHA" --arg sha "$GITHUB_SHA" \
            '{captainDefinitionContent: ({schemaVersion: 2, imageName: $image} | tojson), gitHash: $sha}')
          response=$(curl -sS --fail-with-body --max-time 600 \
            -X POST "${CAPROVER_SERVER%/}/api/v2/user/apps/appData/${CAPROVER_APP_NAME}" \
            -H "Content-Type: application/json" \
            -H "x-namespace: captain" \
            -H "x-captain-app-token: ${CAPROVER_APP_TOKEN}" \
            -d "$body")
          echo "CapRover: $(echo "$response" | jq -c '{status, description}')"
          test "$(echo "$response" | jq -r .status)" = "100"

